name: Build and deploy SIXTH SENSE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned libraries (for integrity hashes)
        run: bash fetch_vendor.sh
      - name: Build single-page app
        env:
          CFITS_ALLOWED_EMAILS: ${{ vars.CFITS_ALLOWED_EMAILS }}
          CFITS_ALLOWED_DOMAINS: ${{ vars.CFITS_ALLOWED_DOMAINS }}
          SIXTHSENSE_BACKEND_URL: ${{ vars.SIXTHSENSE_BACKEND_URL }}
        run: |
          if [ -z "${{ vars.GOOGLE_CLIENT_ID }}" ]; then echo "::error::Set the GOOGLE_CLIENT_ID repository variable (Settings > Secrets and variables > Actions > Variables)"; exit 1; fi
          python3 build.py "${{ vars.GOOGLE_CLIENT_ID }}"
          mkdir -p _site
          cp dist/CFITS.html _site/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
